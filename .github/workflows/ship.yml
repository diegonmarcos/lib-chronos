name: GitHub Pages Deployment (CI)
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Chronos stays at the site root (its published URLs do not move); Sacred-geo is its sibling path, /Sacred-geo/.
      # #1867 their folders moved to 3.Projects/3.0.Chronos and 3.Projects/3.1.Sacred-geo; the published paths are unchanged
      - name: Assemble the site
        run: |
          mkdir -p _site/Sacred-geo
          cp -a 3.Projects/3.0.Chronos/. _site/
          cp -a 3.Projects/3.1.Sacred-geo/. _site/Sacred-geo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
